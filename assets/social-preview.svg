<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">PaperForge — Traceable Paper Reading</title>
  <desc id="desc">Zotero to AI Agent to Obsidian. Evidence-aware research workflow. Local-first.</desc>

  <!-- Solid dark background -->
  <rect width="1280" height="640" fill="#0d1117"/>

  <!-- Subtle grid -->
  <g stroke="#161b22" stroke-width="1">
    <line x1="0" y1="128" x2="1280" y2="128"/>
    <line x1="0" y1="256" x2="1280" y2="256"/>
    <line x1="0" y1="384" x2="1280" y2="384"/>
    <line x1="0" y1="512" x2="1280" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="640"/>
    <line x1="512" y1="0" x2="512" y2="640"/>
    <line x1="768" y1="0" x2="768" y2="640"/>
    <line x1="1024" y1="0" x2="1024" y2="640"/>
  </g>

  <!-- Accent top line -->
  <rect x="0" y="0" width="1280" height="6" fill="#e3b341"/>

  <!-- Title block centered -->
  <g font-family="Segoe UI, -apple-system, Arial, sans-serif">
    <text x="640" y="205" text-anchor="middle" font-size="120" font-weight="700" fill="#e6edf3" letter-spacing="2">PaperForge</text>

    <text x="640" y="285" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="34" font-weight="600" fill="#e3b341" letter-spacing="3">Zotero &#8594; AI Agent &#8594; Obsidian</text>

    <text x="640" y="380" text-anchor="middle" font-size="52" font-weight="600" fill="#e6edf3">Traceable paper reading</text>

    <text x="640" y="450" text-anchor="middle" font-size="46" font-weight="600" fill="#8b949e">Evidence-aware research workflow</text>

    <!-- Local-first badge -->
    <rect x="640" y="486" width="190" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <rect x="656" y="501" width="10" height="10" fill="#e3b341"/>
    <text x="678" y="516" font-size="24" font-weight="600" fill="#e6edf3">LOCAL-FIRST</text>
  </g>

  <!-- Bottom meta -->
  <text x="640" y="596" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="20" fill="#484f58">github.com/Lurek-st/PaperForge &#183; MIT License</text>
</svg>
